# 10 Nov 2026: r05 with per-sample flattening instead of pooled, plus a recorded training seed. Everything else unchanged.
# Recipe and reasoning: pcnumu-runs/plans/r08-per-sample-weighting-plan.md (recipe chosen 10 Nov) and
# second brain findings/2026-11-10-r08-flattening-shape-planning.md. Implementation: plans/r08-implementation-plan.md.
# No input noise: a decided exception to the always-noise rule (one change at a time against r05).
trial: r08_per-sample-flat
status: planned
baseline: r05_v3data-allsamples_v3features
hypothesis: >-
  Flattening each sample's own trueE spectrum over 1-5 GeV (S1 alpha 0.05, S2/S3 alpha 0.02; easing back
  to weight 1 by 8 GeV; each sample's weights average 1) instead of r05's pooled alpha 0.05 reduces S3's
  pull towards the ~2 GeV peak to about r06's level (preview: toy peak pull FHC ~6 vs r05 ~10, r06 ~5)
  while reweighting no harder than r05 (S3 ESS ~49% FHC / 60% RHC vs r05 50% / 53%), so S3 resolution
  stays near r05's (15.2% FHC / 17.2% RHC) instead of r06's (18.8 / 20.7). S1/S2 change little in
  1-5 GeV; S3 events above 5 GeV are no longer boosted. Training is seeded (seed 1): same initial
  weights and batch order on rerun, not bit-identical on GPU; r05 was unseeded, so r08-r05 is judged
  against the r07 noise floor. Loss values are ~5-10x r05's (mean weight 1 vs ~0.2) and not comparable.
  Report everything; judge after.
horns: [fhc, rhc]
overrides:
  seed: 1   # r05: 0 (unused with split_column); now also seeds torch/numpy/random in train_wide.py
horn_overrides:
  fhc:
    weight:
      name: PerSampleFlatWeights
      kwargs:
        per_sample:
          "1": {lo: 1.0, hi: 5.0, ease: 3.0, alpha: 0.05}
          "2": {lo: 1.0, hi: 5.0, ease: 3.0, alpha: 0.02}
          "3": {lo: 1.0, hi: 5.0, ease: 3.0, alpha: 0.02}
  rhc:
    weight:
      name: PerSampleFlatWeights
      kwargs:
        per_sample:
          "1": {lo: 0.9, hi: 5.0, ease: 3.0, alpha: 0.05}
          "2": {lo: 1.0, hi: 5.0, ease: 3.0, alpha: 0.02}
          "3": {lo: 1.0, hi: 5.0, ease: 3.0, alpha: 0.02}
resources:
  mem: 80G          # r05 MaxRSS about 48-52 GB
  time: "08:00:00"  # r05: FHC 3h21, RHC 2h39
