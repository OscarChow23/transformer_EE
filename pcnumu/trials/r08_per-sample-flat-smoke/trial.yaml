# Smoke test of r08 through the loop: the per-sample weighter and seeding inside a real Slurm job (log lines
# `PerSampleFlatWeights sample k:` and `Seeded ... seed 1`), flattening plot, training, checkpoints, prediction,
# on the 2% smoke files, 2 epochs. Not a physics result; it only has to run cleanly before the full r08 is signed.
trial: r08_per-sample-flat-smoke
status: planned
baseline: r08_per-sample-flat
hypothesis: >-
  The loop's generated r08 jobs run end to end in Slurm with PerSampleFlatWeights fitted on the train rows
  (per-sample means 1 in the log), seeded, with finite losses, before the full r08 uses the GPU.
horns: [fhc, rhc]
overrides:
  model.epochs: 2
horn_overrides:
  fhc:
    data_path: /data/nova/chow/transformerEE/datasets/mprod6_1/training_v3/derived/dataset_transformer_ee_fd_fhc_nonswap_training_v3_split_v3features_smoke.csv
  rhc:
    data_path: /data/nova/chow/transformerEE/datasets/mprod6_1/training_v3/derived/dataset_transformer_ee_fd_rhc_nonswap_training_v3_split_v3features_smoke.csv
resources:
  partition: test   # 2 h limit
  time: "01:00:00"
  mem: 32G          # smoke files are about 120 MB
