# Smoke test of r09 through the loop: the per-sample weighter WITH per-sample shares inside a real Slurm job (log lines
# `PerSampleFlatWeights sample k:` and `Seeded ... seed 1`), flattening plot, training, checkpoints, prediction,
# on the 2% smoke files, 2 epochs. Not a physics result; it only has to run cleanly before the full r09 is signed.
trial: r09_per-sample-flat-r05shares-smoke
status: planned
baseline: r09_per-sample-flat-r05shares
hypothesis: >-
  The loop's generated r09 jobs run end to end in Slurm with PerSampleFlatWeights (r05 sample shares) fitted on the train rows
  (log shows each sample's share of weight = the configured share), seeded, with finite losses, before the full r09 uses the GPU.
horns: [fhc, rhc]
overrides:
  model.epochs: 2
horn_overrides:
  fhc:
    data_path: /data/nova/chow/transformerEE/datasets/mprod6_1/training_v3/derived/dataset_transformer_ee_fd_fhc_nonswap_training_v3_split_v3features_smoke.csv
  rhc:
    data_path: /data/nova/chow/transformerEE/datasets/mprod6_1/training_v3/derived/dataset_transformer_ee_fd_rhc_nonswap_training_v3_split_v3features_smoke.csv
resources:
  partition: test   # 2 h limit
  time: "01:00:00"
  mem: 32G          # smoke files are about 120 MB
